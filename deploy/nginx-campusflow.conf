events {}

http {
    resolver 127.0.0.11;

    # HTTP solo sirve para validar el certificado y redirigir a HTTPS.
    server {
        listen 80;
        server_name campusuphflow.duckdns.org;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # El proxy compartido entrega CampusFlow a sus dos contenedores.
    server {
        listen 443 ssl;
        server_name campusuphflow.duckdns.org;

        ssl_certificate /etc/letsencrypt/live/campusuphflow.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/campusuphflow.duckdns.org/privkey.pem;
        client_max_body_size 10m;

        location /api/ {
            proxy_pass http://campusflow-backend:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /uploads/ {
            proxy_pass http://campusflow-backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location / {
            proxy_pass http://campusflow-frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # TiendaMGR conserva su propio contenedor frontend en la misma red.
    server {
        listen 80;
        server_name tiendamgr.duckdns.org;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name tiendamgr.duckdns.org;

        ssl_certificate /etc/letsencrypt/live/tiendamgr.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/tiendamgr.duckdns.org/privkey.pem;

        location / {
            proxy_pass http://tienda-frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
