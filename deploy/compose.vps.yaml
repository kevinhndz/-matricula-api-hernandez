services:
  api:
    image: campusflow-api:main
    container_name: campusflow-backend
    restart: unless-stopped
    env_file:
      - /srv/proyectos/CampusFlow/.env
    environment:
      UPLOADS_DIR: /app/uploads
    expose:
      - "8000"
    volumes:
      - campusflow_uploads:/app/uploads
    networks:
      red-saas:
        aliases:
          - campusflow-backend

  frontend:
    image: campusflow-frontend:main
    container_name: campusflow-frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      red-saas:
        aliases:
          - campusflow-frontend

volumes:
  campusflow_uploads:

networks:
  red-saas:
    name: red-saas
    external: true
