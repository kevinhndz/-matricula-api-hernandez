name: CI CD CampusFlow

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: campusflow-main
  cancel-in-progress: false

jobs:
  compilar-y-desplegar:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v5

      - name: Preparar Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Comprobar compilacion del frontend
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend

      - name: Construir imagenes de API y frontend
        run: |
          docker build --pull --tag campusflow-api:main .
          docker build --pull --tag campusflow-frontend:main ./frontend

      - name: Empaquetar imagenes
        run: |
          docker save campusflow-api:main | gzip -1 > /tmp/campusflow-api.tar.gz
          docker save campusflow-frontend:main | gzip -1 > /tmp/campusflow-frontend.tar.gz

      - name: Preparar acceso seguro al VPS
        if: github.event_name != 'pull_request'
        env:
          DEPLOY_KEY: ${{ secrets.CAMPUSFLOW_DEPLOY_KEY }}
          VPS_HOST: ${{ vars.CAMPUSFLOW_VPS_HOST }}
          VPS_USER: ${{ vars.CAMPUSFLOW_VPS_USER }}
          VPS_KNOWN_HOSTS: ${{ vars.CAMPUSFLOW_VPS_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_KEY" || { echo "Falta CAMPUSFLOW_DEPLOY_KEY"; exit 1; }
          test -n "$VPS_HOST" || { echo "Falta CAMPUSFLOW_VPS_HOST"; exit 1; }
          test -n "$VPS_USER" || { echo "Falta CAMPUSFLOW_VPS_USER"; exit 1; }
          test -n "$VPS_KNOWN_HOSTS" || { echo "Falta CAMPUSFLOW_VPS_KNOWN_HOSTS"; exit 1; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/campusflow_deploy"
          chmod 600 "$HOME/.ssh/campusflow_deploy"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          if ! [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ && "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]; then
            echo "Host o usuario del VPS tiene un formato invalido"
            exit 1
          fi

      - name: Copiar imagenes al VPS
        if: github.event_name != 'pull_request'
        env:
          VPS_HOST: ${{ vars.CAMPUSFLOW_VPS_HOST }}
          VPS_USER: ${{ vars.CAMPUSFLOW_VPS_USER }}
        run: |
          destino="$VPS_USER@$VPS_HOST"
          version="${GITHUB_SHA}"
          carpeta="/home/$VPS_USER/releases/$version"
          ssh -i "$HOME/.ssh/campusflow_deploy" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$destino" "mkdir -p '$carpeta'"
          scp -i "$HOME/.ssh/campusflow_deploy" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            /tmp/campusflow-api.tar.gz /tmp/campusflow-frontend.tar.gz "$destino:$carpeta/"

      - name: Desplegar los dos servicios y verificar
        if: github.event_name != 'pull_request'
        env:
          VPS_HOST: ${{ vars.CAMPUSFLOW_VPS_HOST }}
          VPS_USER: ${{ vars.CAMPUSFLOW_VPS_USER }}
        run: |
          destino="$VPS_USER@$VPS_HOST"
          ssh -i "$HOME/.ssh/campusflow_deploy" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$destino" \
            "bash -s -- '$GITHUB_SHA' '$VPS_USER'" <<'REMOTE'
          set -euo pipefail
          version="$1"
          usuario="$2"
          repo=/srv/proyectos/CampusFlow
          paquete="/home/$usuario/releases/$version"
          anterior_api="campusflow-api:rollback-$version"
          anterior_frontend="campusflow-frontend:rollback-$version"
          actualizado=0

          restaurar() {
            codigo="${1:-$?}"
            trap - ERR
            if [ "$actualizado" = 1 ]; then
              if docker image inspect "$anterior_api" >/dev/null 2>&1; then
                docker image tag "$anterior_api" campusflow-api:main || true
              fi
              if docker image inspect "$anterior_frontend" >/dev/null 2>&1; then
                docker image tag "$anterior_frontend" campusflow-frontend:main || true
              fi
              docker compose --project-name campusflow --project-directory "$repo" \
                -f "$repo/deploy/compose.vps.yaml" up -d --no-deps --force-recreate api frontend || true
            fi
            exit "$codigo"
          }
          trap restaurar ERR

          cd "$repo"
          git fetch origin main
          git reset --hard "$version"
          test "$(git rev-parse HEAD)" = "$version"
          docker network inspect red-saas >/dev/null

          if docker image inspect campusflow-api:main >/dev/null 2>&1; then
            docker image tag campusflow-api:main "$anterior_api"
          fi
          if docker image inspect campusflow-frontend:main >/dev/null 2>&1; then
            docker image tag campusflow-frontend:main "$anterior_frontend"
          fi

          actualizado=1
          docker load --input "$paquete/campusflow-api.tar.gz"
          docker load --input "$paquete/campusflow-frontend.tar.gz"
          docker compose --project-name campusflow --project-directory "$repo" \
            -f "$repo/deploy/compose.vps.yaml" up -d --no-deps --force-recreate api frontend

          if ! curl --retry 8 --retry-delay 2 --retry-all-errors -fsS -o /dev/null \
            https://campusuphflow.duckdns.org/api/docs || ! curl --retry 8 --retry-delay 2 --retry-all-errors -fsS -o /dev/null \
            https://campusuphflow.duckdns.org/; then
            restaurar 1
          fi

          actualizado=0
          docker image rm "$anterior_api" "$anterior_frontend" >/dev/null 2>&1 || true
          rm -rf "$paquete"
          REMOTE
